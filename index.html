<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="KinChat: webchat UI for Kin personas (Kerbeus, Beatrice, BeeQueen)." />
    <meta name="theme-color" content="#1e1e24" />
    <meta property="og:title" content="KinChat" />
    <meta property="og:description" content="KinChat for Kin personas" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KinChat" />
    <meta name="twitter:description" content="KinChat for Kin personas" />
    <title>KinChat</title>
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
  </head>
  <body>
    <div id="root">
      <!-- Loading spinner shown while JS bundles load, replaced by React -->
      <div id="app-loader" style="display:flex;align-items:center;justify-content:center;height:100vh;background:#18181b;flex-direction:column;gap:16px;">
        <div style="width:40px;height:40px;border:3px solid rgba(255,255,255,0.1);border-top-color:#06b6d4;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
        <span style="color:rgba(255,255,255,0.4);font-family:system-ui,sans-serif;font-size:13px;">Loading KinChat…</span>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
    </div>
    <noscript>
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#18181b;color:#a1a1aa;font-family:system-ui,sans-serif;text-align:center;padding:2rem;">
        <p>KinChat requires JavaScript to run. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
